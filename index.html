<html lang="id">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        :root {
            --primary: #4A90E2;
            --primary-dark: #357ABD;
            --secondary: #FF6B6B;
            --accent: #FFD166;
            --success: #06D6A0;
            --bg-color: #F4F7FE;
            --card-bg: #FFFFFF;
            --text-main: #2D3748;
            --text-muted: #718096;
            --border-radius: 16px;
        }

        * {
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            user-select: none;
        }

        .container {
            width: 100%;
            max-width: 850px;
            background: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            padding: 30px;
            position: relative;
            overflow: hidden;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        /* Login Screen */
        .header-title {
            text-align: center;
            color: var(--primary);
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .header-subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-main);
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #E2E8F0;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            border-color: var(--primary);
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .btn:hover {
            background: var(--primary-dark);
        }

        .btn:active {
            transform: scale(0.98);
        }

        /* Top Bar */
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 15px;
            border-bottom: 2px solid #EDF2F7;
            margin-bottom: 20px;
        }

        .timer-badge {
            background: #FFF5F5;
            color: var(--secondary);
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid #FEB2B2;
        }

        .warning-badge {
            background: #FEFCBF;
            color: #D69E2E;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 700;
        }

        /* Reading Text Box */
        .reading-box {
            background: #EDF2F7;
            border-left: 5px solid var(--primary);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            line-height: 1.6;
            max-height: 220px;
            overflow-y: auto;
            white-space: pre-line;
        }

        .question-text {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        /* Media / Image Slot */
        .image-slot {
            width: 100%;
            max-height: 220px;
            object-fit: contain;
            border-radius: 10px;
            margin-bottom: 15px;
            display: none;
            background: #F7FAFC;
            border: 1px dashed #CBD5E0;
        }

        /* Options */
        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }

        .option-card {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border: 2px solid #E2E8F0;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            background: #FAFCFE;
        }

        .option-card:hover {
            border-color: var(--primary);
            background: #EBF8FF;
        }

        .option-card.selected {
            border-color: var(--primary);
            background: #EBF8FF;
            font-weight: 600;
        }

        .option-prefix {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #EDF2F7;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 700;
            margin-right: 12px;
            flex-shrink: 0;
        }

        .option-card.selected .option-prefix {
            background: var(--primary);
            color: white;
        }

        .option-img {
            max-width: 80px;
            max-height: 50px;
            margin-left: 10px;
            border-radius: 4px;
            display: none;
        }

        /* Navigation Buttons */
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            gap: 15px;
        }

        .btn-nav {
            width: auto;
            padding: 10px 24px;
        }

        .btn-secondary {
            background: #E2E8F0;
            color: var(--text-main);
        }

        .btn-secondary:hover {
            background: #CBD5E0;
        }

        .btn-finish {
            background: var(--success);
        }

        .btn-finish:hover {
            background: #05B98A;
        }

        /* Result Screen */
        .score-box {
            text-align: center;
            padding: 20px;
            background: #EBF8FF;
            border-radius: 16px;
            margin-bottom: 20px;
        }

        .score-val {
            font-size: 54px;
            font-weight: 800;
            color: var(--primary);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: #F7FAFC;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid #E2E8F0;
        }

        .stat-card .num {
            font-weight: 700;
            font-size: 18px;
        }

        .stat-card.wrong .num { color: var(--secondary); }
        .stat-card.correct .num { color: var(--success); }

        .wrong-list-box {
            background: #FFF5F5;
            border: 1px solid #FEB2B2;
            padding: 12px;
            border-radius: 10px;
            font-size: 13px;
            color: #C53030;
            margin-bottom: 20px;
        }

        .gas-notice {
            background: #FEFCBF;
            border: 1px dashed #D69E2E;
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            color: #744210;
            margin-top: 15px;
            text-align: center;
        }
    </style>
</head>

    <div id="screen-login" class="screen active">

        </div>
    </div>

    <!-- SCREEN 2: QUIZ -->
    <div id="screen-quiz" class="screen">
        <div class="quiz-header">
            <div>
                <span style="font-weight:700; color:var(--primary)" id="displayStudent"></span>
                <span style="font-size:12px; color:var(--text-muted)" id="displayClass"></span>

            <div class="timer-badge">

            </div>
        </div>

        <!-- Slot Teks Bacaan / Dialog -->
        <div id="readingBox" class="reading-box" style="display: none;"></div>

        <!-- Slot Image URL Soal -->
        <img id="questionImage" class="image-slot" src="" alt="Gambar Soal">

        <div class="question-text" id="questionText">Loading...</div>

        <div class="options-grid" id="optionsContainer">
            <!-- Option Cards Generated via JS -->
        </div>

        <div class="nav-buttons">
            <button id="btnPrev" class="btn btn-secondary btn-nav" onclick="prevQuestion()">Sebelumnya</button>
            <button id="btnNext" class="btn btn-nav" onclick="nextQuestion()">Selanjutnya</button>
        </div>
    </div>

    <!-- SCREEN 3: RESULT -->
    <div id="screen-result" class="screen">
        <h2 style="text-align: center; margin-bottom: 10px;">Hasil Asesmen</h2>
        <p style="text-align: center; color: var(--text-muted); font-size: 14px; margin-bottom: 20px;" id="resultStudentInfo"></p>

        <div class="score-box">
            <div style="font-size: 14px; font-weight: 600; color: var(--text-muted);">SKOR AKHIR</div>
            <div class="score-val" id="finalScore">0</div>
        </div>

        <div class="stats-grid">
            <div class="stat-card correct">
                <div>Jawaban Benar</div>
                <div class="num" id="correctCount">0</div>
            </div>
            <div class="stat-card wrong">
                <div>Jawaban Salah</div>
                <div class="num" id="wrongCount">0</div>
            </div>
        </div>

        <div class="wrong-list-box" id="wrongList">
            No Soal Salah: -
        </div>

        <button class="btn" onclick="resetApp()">Kembali ke Halaman Utama</button>
    </div>
</div>

    /* ==========================================================================
       3. STATE DAN LOGIKA APLIKASI
       ========================================================================== */
    let studentData = { name: "", class: "" };
    let userAnswers = new Array(questionsData.length).fill(null);
    let currentIdx = 0;
    let timerInterval = null;
    let timeLeft = 60 * 60; // 60 menit dalam detik
    let violations = 0;

    // Pindah Tampilan Layar
    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    // Mulai Kuis
    function startQuiz(e) {
        e.preventDefault();
        const inputPass = document.getElementById('passcode').value;
        if (inputPass !== SYSTEM_PASSCODE) {
            alert('Passcode yang Anda masukkan salah!');
            return;
        }

        studentData.name = document.getElementById('studentName').value.trim();
        studentData.class = document.getElementById('studentClass').value.trim();

        document.getElementById('displayStudent').innerText = studentData.name;
        document.getElementById('displayClass').innerText = `(${studentData.class})`;

        showScreen('screen-quiz');
        renderQuestion();
        startTimer();
        setupProctoring();
    }

    // Render Soal Aktual
    function renderQuestion() {
        const q = questionsData[currentIdx];

        // Teks Bacaan
        const readingBox = document.getElementById('readingBox');
        if (q.readingText) {
            readingBox.innerText = q.readingText;
            readingBox.style.display = 'block';
        } else {
            readingBox.style.display = 'none';
        }

        // Gambar Soal
        const qImg = document.getElementById('questionImage');
        if (q.imageURL && q.imageURL.trim() !== "") {
            qImg.src = q.imageURL;
            qImg.style.display = 'block';
        } else {
            qImg.style.display = 'none';
        }

        // Teks Soal
        document.getElementById('questionText').innerText = q.question;

        // Container Pilihan Ganda
        const container = document.getElementById('optionsContainer');
        container.innerHTML = '';

        const prefixes = ['A', 'B', 'C', 'D'];
        q.options.forEach((opt, idx) => {
            const card = document.createElement('div');
            card.className = `option-card ${userAnswers[currentIdx] === idx ? 'selected' : ''}`;
            card.onclick = () => selectOption(idx);

            let imgHTML = (opt.img && opt.img.trim() !== "") ? `<img src="${opt.img}" class="option-img" style="display:inline-block;" />` : '';

            card.innerHTML = `
                <div class="option-prefix">${prefixes[idx]}</div>
                <div style="flex-grow: 1;">${opt.text}</div>
                ${imgHTML}
            `;
            container.appendChild(card);
        });

        // Kontrol Tombol Navigasi
        document.getElementById('btnPrev').style.visibility = currentIdx === 0 ? 'hidden' : 'visible';
        const nextBtn = document.getElementById('btnNext');
        if (currentIdx === questionsData.length - 1) {
            nextBtn.innerText = "Selesai & Kirim";
            nextBtn.className = "btn btn-nav btn-finish";
        } else {
            nextBtn.innerText = "Selanjutnya";
            nextBtn.className = "btn btn-nav";
        }
    }

    function selectOption(optIdx) {
        userAnswers[currentIdx] = optIdx;
        renderQuestion();
    }

    function prevQuestion() {
        if (currentIdx > 0) {
            currentIdx--;
            renderQuestion();
        }
    }

    function nextQuestion() {
        if (currentIdx < questionsData.length - 1) {
            currentIdx++;
            renderQuestion();
        } else {
            if (confirm("Apakah Anda yakin ingin menyelesaikan ujian dan mengirim jawaban?")) {
                finishQuiz();
            }
        }
    }

    /* ==========================================================================
       4. TIMER & PENCEGAHAN KECURANGAN
       ========================================================================== */
    function startTimer() {
        timerInterval = setInterval(() => {
            timeLeft--;
            let mins = Math.floor(timeLeft / 60);
            let secs = timeLeft % 60;
            document.getElementById('timerDisplay').innerText = 
                `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;

            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                alert("Waktu pengerjaan telah habis!");
                finishQuiz();
            }
        }, 1000);
    }

    function setupProctoring() {
        // Deteksi Perpindahan Tab / Window Blur
        window.onblur = function() {
            violations++;
            document.getElementById('violationBadge').innerText = `Pelanggaran: ${violations}/3`;
            if (violations >= 3) {
                alert("Anda telah melakukan pelanggaran terbanyak (3 kali keluar dari halaman ujian). Ujian dibatalkan dan dikembalikan ke awal!");
                resetApp();
            } else {
                alert(`Peringatan Pelanggaran (${violations}/3): Dilarang berpindah tab atau meninggalkan layar ujian!`);
            }
        };
    }

    function clearProctoring() {
        window.onblur = null;
    }

    /* ==========================================================================
       5. PERHITUNGAN SKOR & PENGIRIMAN DATA
       ========================================================================== */
    function finishQuiz() {
        clearInterval(timerInterval);
        clearProctoring();

        let correct = 0;
        let wrong = 0;
        let wrongQuestions = [];

        questionsData.forEach((q, idx) => {
            if (userAnswers[idx] === q.answer) {
                correct++;
            } else {
                wrong++;
                wrongQuestions.push(q.id);
            }
        });

        // Perhitungan Skor (Skala 100)
        let finalScore = Math.round((correct / questionsData.length) * 100);

        // Tampilkan Hasil
        document.getElementById('finalScore').innerText = finalScore;
        document.getElementById('correctCount').innerText = correct;
        document.getElementById('wrongCount').innerText = wrong;
        document.getElementById('wrongList').innerText = wrongQuestions.length > 0 ? 
            `No Soal Salah: ${wrongQuestions.join(', ')}` : "Selamat! Tidak ada jawaban yang salah.";
        document.getElementById('resultStudentInfo').innerText = `${studentData.name} (${studentData.class})`;

        showScreen('screen-result');

        // Payload Data untuk Google Apps Script (GAS)
        const payload = {
            timestamp: new Date().toLocaleString("id-ID"),
            nama: studentData.name,
            kelas: studentData.class,
            benar: correct,
            salah: wrong,
            skorAkhir: finalScore,
            jumlahPelanggaran: violations,
            noSoalSalah: wrongQuestions.join(', ')
        };

        sendDataToGAS(payload);
    }

    function sendDataToGAS(data) {
        if (!GAS_WEB_APP_URL || GAS_WEB_APP_URL.includes("AKfycbx...")) {
            console.log("GAS URL belum diatur secara spesifik. Data lokal:", data);
            return;
        }

        fetch(GAS_WEB_APP_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        })
        .then(() => console.log("Data berhasil dikirim ke Google Sheets."))
        .catch(err => console.error("Gagal mengirim data ke GAS:", err));
    }

    function resetApp() {
        clearInterval(timerInterval);
        clearProctoring();
        timeLeft = 60 * 60;
        violations = 0;
        userAnswers = new Array(questionsData.length).fill(null);
        currentIdx = 0;
        document.getElementById('loginForm').reset();
        document.getElementById('violationBadge').innerText = `Pelanggaran: 0/3`;
        showScreen('screen-login');
    }
</script>
